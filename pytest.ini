[pytest]
testpaths = tests
pythonpath = .
addopts = -q -p no:cacheprovider
markers =
    caracterizacion: fija el comportamiento ACTUAL, incluidos los defectos documentados (R-xx). Solo cambia su expectativa una decision aprobada.
    bd_desarrollo: requiere la BD de desarrollo aislada (docs/ai/13-entorno-desarrollo-bd.md). Se omite si no esta configurada.
filterwarnings =
    ignore::DeprecationWarning
